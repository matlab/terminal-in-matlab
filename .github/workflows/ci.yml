name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-server:
    name: Test Go Server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.21'
          cache: false

      - name: Test
        run: go test -v -count=1 ./...

  build-server:
    name: Build Go Server (${{ matrix.matlab_arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            matlab_arch: glnxa64
            binary: matlab-terminal-server
          - goos: darwin
            goarch: amd64
            matlab_arch: maci64
            binary: matlab-terminal-server
          - goos: darwin
            goarch: arm64
            matlab_arch: maca64
            binary: matlab-terminal-server
          - goos: windows
            goarch: amd64
            matlab_arch: win64
            binary: matlab-terminal-server.exe
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.21'
          cache: false

      - name: Vet
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go vet ./...

      - name: Build
        run: |
          # CGO_ENABLED=0 statically links the pure-Go binary so it has no
          # glibc dependency and runs on older Linux distros (e.g. RHEL 8).
          # Keep this in sync with release.yml.
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-s -w" \
            -o ../dist/${{ matrix.matlab_arch }}/${{ matrix.binary }} .

  glibc-compat:
    name: Linux glibc Compatibility (RHEL 8 / glibc 2.28)
    runs-on: ubuntu-latest
    # Regression guard for the RHEL 8 loader error ("GLIBC_2.34 not found").
    # Builds the linux/amd64 server and runs it inside a glibc 2.28 container
    # that mirrors RHEL 8.10. Fails if the binary requires versioned GLIBC
    # symbols or cannot start on the old-glibc image.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.21'
          cache: false

      - name: Run Linux glibc compatibility test
        run: ./build/test_linux_compat.sh
